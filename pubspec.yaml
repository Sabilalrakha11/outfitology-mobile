name: outfitology
description: E-commerce fashion app — Outfitology

publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  
  # Local storage
  shared_preferences: ^2.3.1
  
  # Google Fonts (Playfair Display + DM Sans)
  google_fonts: ^6.2.1
  
  # Image picker (untuk upload produk)
  image_picker: ^1.1.2
  
  # WebView untuk Midtrans payment
  webview_flutter: ^4.7.0
  
  # Image zoom di product detail
  photo_view: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # Kalau nanti mau tambah assets/gambar lokal:
  # assets:
  #   - assets/images/

# ============================================================
# CATATAN SETUP:
# 
# 1. Android: tambahkan di android/app/src/main/AndroidManifest.xml
#    <uses-permission android:name="android.permission.INTERNET"/>
#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
#    <uses-permission android:name="android.permission.CAMERA"/>
#
# 2. iOS: tambahkan di ios/Runner/Info.plist
#    <key>NSPhotoLibraryUsageDescription</key>
#    <string>Outfitology perlu akses galeri untuk upload foto produk.</string>
#    <key>NSCameraUsageDescription</key>
#    <string>Outfitology perlu akses kamera untuk foto produk.</string>
#    <key>io.flutter.embedded_views_preview</key>
#    <true/>
#
# 3. Jalankan: flutter pub get
# ============================================================